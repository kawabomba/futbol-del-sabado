<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fútbol del Sábado</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 100px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 18px 50px;
}

h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}


/* CONTADOR STICKY */

.sticky-counter {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(17, 17, 17, 0.96);
    backdrop-filter: blur(8px);
    padding: 10px 12px;
    margin: 0 -18px 18px;
    border-bottom: 1px solid #292929;
    text-align: center;
}

#stickyCounter {
    font-size: 19px;
    font-weight: bold;
}

#stickyMessage {
    font-size: 13px;
    color: #aaa;
    margin-top: 3px;
}


/* INFO */

.top-info {
    background: #1c1c1c;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: center;
    border: 1px solid #292929;
}

.rating-summary {
    color: #aaa;
    font-size: 14px;
}


/* BOTÓN NUEVO SÁBADO */

.new-saturday-button {
    margin-top: 14px;
}


/* BARRA INFERIOR */

.bottom-bar {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 24px));
    z-index: 500;

    background: rgba(28, 28, 28, 0.96);
    backdrop-filter: blur(12px);

    border: 1px solid #3a3a3a;
    border-radius: 16px;

    padding: 10px;

    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
}

.bottom-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.mode-switch {
    display: flex;
    flex: 1;
    background: #111;
    border-radius: 10px;
    padding: 3px;
    border: 1px solid #333;
}

.mode-button {
    flex: 1;
    background: transparent;
    color: #aaa;
    padding: 10px 8px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
}

.mode-button.active {
    background: #293d50;
    color: white;
}

.bottom-action {
    white-space: nowrap;
}

.btn-main {
    background: #1f8f4d;
    color: white;
}

.btn-gray {
    background: #333;
    color: white;
}

.btn-blue {
    background: #2864d7;
    color: white;
}

.btn-red {
    background: #b83232;
    color: white;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 17px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
}

button:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.1);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}


/* JUGADORES */

.players-section {
    background: #1c1c1c;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid #292929;
}

.section-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}

.players-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.player {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #252525;
    padding: 10px;
    border-radius: 10px;
    min-width: 0;
    cursor: pointer;
    user-select: none;
    border: 2px solid transparent;
    transition: 0.15s;
}

.player:hover {
    background: #2d2d2d;
}

.player.selected {
    background: #173b28;
    border-color: #2e9d59;
}

.player input {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
    pointer-events: none;
}

.player-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.player-stars {
    color: #ffc107;
    font-size: 12px;
    white-space: nowrap;
}

.player-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
}

.icon-button {
    background: #333;
    color: white;
    padding: 6px 8px;
    border-radius: 7px;
    font-size: 13px;
}


/* AGREGAR */

.add-player {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.add-player input {
    flex: 1;
    background: #111;
    border: 1px solid #444;
    color: white;
    border-radius: 9px;
    padding: 12px;
    font-size: 15px;
}


/* EQUIPOS */

.teams-section {
    margin-top: 25px;
    scroll-margin-top: 70px;
}

.teams-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
}

.teams-title {
    font-size: 23px;
    font-weight: bold;
}

.team-tools {
    display: flex;
    gap: 7px;
}

.small-button {
    padding: 9px 11px;
    font-size: 13px;
    background: #333;
    color: white;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.team {
    background: #1c1c1c;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid #292929;
}

.team h2 {
    margin-top: 0;
    text-align: center;
    font-size: 23px;
}

.team-a h2 {
    color: #4da3ff;
}

.team-b h2 {
    color: #ff6868;
}

.team-player {
    background: #252525;
    border-radius: 9px;
    padding: 11px;
    margin: 7px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.team-player .stars {
    color: #ffc107;
    font-size: 13px;
}

.team-total {
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid #333;
    text-align: center;
    color: #aaa;
    font-size: 14px;
}


/* ULTIMO ARMADO */

.last-match {
    background: #1c1c1c;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 18px;
    margin-top: 25px;
}

.last-match h2 {
    text-align: center;
    margin-top: 0;
}

.last-date {
    text-align: center;
    color: #888;
    margin-bottom: 18px;
    font-size: 14px;
}

.last-teams {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.last-team {
    background: #252525;
    border-radius: 10px;
    padding: 13px;
}

.last-team h3 {
    margin-top: 0;
    text-align: center;
}

.last-team ul {
    margin: 0;
    padding-left: 20px;
    color: #ddd;
}

.empty-last {
    text-align: center;
    color: #777;
    padding: 10px;
}


/* MENSAJE */

.warning {
    background: #432525;
    border: 1px solid #733737;
    color: #ffb5b5;
    border-radius: 10px;
    padding: 12px;
    margin-top: 15px;
    margin-bottom: 15px;
    text-align: center;
    display: none;
}


/* MODAL */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-content {
    width: 100%;
    max-width: 450px;
    background: #1c1c1c;
    border-radius: 15px;
    padding: 22px;
    border: 1px solid #333;
}

.modal-content h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #ccc;
    font-weight: bold;
}

.form-group input,
.form-group select {
    width: 100%;
    background: #111;
    border: 1px solid #444;
    color: white;
    border-radius: 9px;
    padding: 11px;
    font-size: 15px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
}


/* MOBILE */

@media (max-width: 750px) {

    .players-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .teams {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 27px;
    }

    .bottom-row {
        flex-wrap: wrap;
    }

    .mode-switch {
        width: 100%;
        flex: none;
    }

    .bottom-action {
        flex: 1;
    }

    .bottom-action button {
        width: 100%;
    }

}


@media (max-width: 480px) {

    .players-grid {
        grid-template-columns: 1fr;
    }

    .add-player {
        flex-direction: column;
    }

    .player {
        min-height: 48px;
    }

    .teams-header {
        align-items: stretch;
        flex-direction: column;
    }

    .team-tools {
        width: 100%;
    }

    .team-tools button {
        flex: 1;
    }

    .bottom-bar {
        bottom: 8px;
        width: calc(100% - 16px);
    }

    .bottom-row {
        gap: 6px;
    }

    .bottom-action {
        font-size: 13px;
    }

    .bottom-action button {
        padding: 11px 8px;
    }

}

</style>
</head>


<body>

<div class="container">


    <h1>
        ⚽ Fútbol del Sábado

        <span style="
            font-size: 11px;
            color: #777;
            font-weight: normal;
            margin-left: 6px;
            vertical-align: middle;
        ">
            By Kevin
        </span>
    </h1>


    <div class="subtitle">
        Armá los equipos y no me rompas los huevubis
    </div>


    <!-- CONTADOR ÚNICO -->

    <div class="sticky-counter">

        <div id="stickyCounter">
            0 / 12
        </div>

        <div id="stickyMessage">
            Seleccioná 12 jugadores
        </div>

    </div>


    <!-- INFO -->

    <div class="top-info">

        <div
            class="rating-summary"
            id="ratingSummary">
        </div>

        <button
            class="btn-gray new-saturday-button"
            onclick="newSaturday()">

            🔄 Nuevo sábado

        </button>

    </div>


    <div
        class="warning"
        id="warning">
    </div>


    <!-- JUGADORES -->

    <div class="players-section">

        <div class="section-title">
            👥 Jugadores
        </div>


        <div
            class="players-grid"
            id="playersGrid">
        </div>


        <div class="add-player">

            <input
                type="text"
                id="newPlayerName"
                placeholder="Nombre del nuevo jugador"
                maxlength="30"
                onkeydown="if(event.key === 'Enter') addPlayer()">


            <button
                class="btn-main"
                onclick="addPlayer()">

                ➕ Agregar

            </button>

        </div>

    </div>


    <!-- EQUIPOS -->

    <div
        class="teams-section"
        id="teamsSection">

        <div class="teams-header">

            <div class="teams-title">
                ⚽ Equipos
            </div>

            <div
                class="team-tools"
                id="teamTools"
                style="display:none;">

                <button
                    class="small-button"
                    onclick="copyTeams()">

                    📋 Copiar

                </button>

                <button
                    class="small-button"
                    onclick="shareTeamsAsImage()">

                    📸 Imagen

                </button>

            </div>

        </div>


        <div
            class="teams"
            id="teamsContainer">
        </div>

    </div>


    <!-- ULTIMO ARMADO -->

    <div class="last-match">

        <h2>
            📋 Último armado
        </h2>

        <div id="lastMatchContent">

            <div class="empty-last">
                Todavía no hay un armado anterior.
            </div>

        </div>

    </div>


</div>


<!-- BARRA INFERIOR -->

<div class="bottom-bar">

    <div class="bottom-row">


        <div class="mode-switch">

            <button
                id="randomMode"
                class="mode-button active"
                onclick="setMode('random')">

                🎲 Aleatorio

            </button>


            <button
                id="balancedMode"
                class="mode-button"
                onclick="setMode('balanced')">

                ⚖️ Equilibrado

            </button>

        </div>


        <div class="bottom-action">

            <button
                class="btn-gray"
                onclick="clearSelection()">

                🧹 Limpiar

            </button>

        </div>


        <div class="bottom-action">

            <button
                class="btn-main"
                id="generateButton"
                onclick="generateTeams()"
                disabled>

                ⚽ ARMAR

            </button>

        </div>


    </div>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="editModal">


    <div class="modal-content">

        <h2>
            ⚙️ Editar jugador
        </h2>


        <div class="form-group">

            <label>
                Nombre
            </label>

            <input
                type="text"
                id="editName"
                maxlength="30">

        </div>


        <div class="form-group">

            <label>
                Nivel (opcional)
            </label>

            <select id="editLevel">

                <option value="">
                    Sin valorar
                </option>

                <option value="1">
                    ⭐ 1
                </option>

                <option value="2">
                    ⭐⭐ 2
                </option>

                <option value="3">
                    ⭐⭐⭐ 3
                </option>

                <option value="4">
                    ⭐⭐⭐⭐ 4
                </option>

                <option value="5">
                    ⭐⭐⭐⭐⭐ 5
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Posición (opcional)
            </label>

            <select id="editPosition">

                <option value="">
                    Sin posición
                </option>

                <option value="Arquero">
                    🧤 Arquero
                </option>

                <option value="Defensa">
                    🛡️ Defensa
                </option>

                <option value="Medio">
                    ⚽ Medio
                </option>

                <option value="Delantero">
                    🎯 Delantero
                </option>

                <option value="Cualquiera">
                    🔄 Cualquiera
                </option>

            </select>

        </div>


        <div class="modal-buttons">

            <button
                class="btn-gray"
                onclick="closeModal()">

                Cancelar

            </button>


            <button
                class="btn-main"
                onclick="savePlayer()">

                💾 Guardar

            </button>

        </div>

    </div>

</div>


<script>


/* JUGADORES INICIALES */

const defaultPlayers = [

    "Kevin",
    "Carlos",
    "Brian",
    "Alan Lopez",
    "Alan Casla",
    "Joel Abejita",
    "Facu",
    "Joaquin",
    "Menzo",
    "Martin",
    "Ivo",
    "Nicolas",
    "El Pela",
    "Mateo",
    "Gian",
    "Yuseet"

];


let players =
    JSON.parse(
        localStorage.getItem("footballPlayers")
    ) || defaultPlayers;


let selectedPlayers =
    JSON.parse(
        localStorage.getItem("selectedPlayers")
    ) || [];


let playerData =
    JSON.parse(
        localStorage.getItem("playerData")
    ) || {};


let lastMatch =
    JSON.parse(
        localStorage.getItem("lastMatch")
    ) || null;


/*
    HISTORIAL INTERNO

    Guarda los equipos anteriores para poder
    evitar repetir compañeros.

    No se muestra al usuario.
*/

let matchHistory =
    JSON.parse(
        localStorage.getItem("matchHistory")
    ) || [];


let currentEditPlayer = null;

let currentMode = "random";


/* GUARDAR */

function saveData() {

    localStorage.setItem(
        "footballPlayers",
        JSON.stringify(players)
    );

    localStorage.setItem(
        "selectedPlayers",
        JSON.stringify(selectedPlayers)
    );

    localStorage.setItem(
        "playerData",
        JSON.stringify(playerData)
    );

    localStorage.setItem(
        "lastMatch",
        JSON.stringify(lastMatch)
    );

    localStorage.setItem(
        "matchHistory",
        JSON.stringify(matchHistory)
    );

}


/* MOSTRAR JUGADORES */

function renderPlayers() {

    const grid =
        document.getElementById("playersGrid");

    grid.innerHTML = "";


    players.forEach(player => {

        const data =
            playerData[player] || {};


        const div =
            document.createElement("div");

        div.className = "player";


        if (selectedPlayers.includes(player)) {

            div.classList.add("selected");

        }


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.checked =
            selectedPlayers.includes(player);

        checkbox.tabIndex = -1;


        const name =
            document.createElement("div");

        name.className = "player-name";

        name.textContent = player;


        const stars =
            document.createElement("div");

        stars.className = "player-stars";


        if (data.level) {

            stars.textContent =
                "★".repeat(
                    Number(data.level)
                );

        }


        const actions =
            document.createElement("div");

        actions.className =
            "player-actions";


        const editButton =
            document.createElement("button");

        editButton.className =
            "icon-button";

        editButton.textContent = "⚙️";

        editButton.title =
            "Editar jugador";


        editButton.onclick =
            event => {

                event.stopPropagation();

                openEditModal(player);

            };


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "icon-button";

        deleteButton.textContent = "🗑️";

        deleteButton.title =
            "Eliminar jugador";


        deleteButton.onclick =
            event => {

                event.stopPropagation();

                deletePlayer(player);

            };


        actions.appendChild(editButton);

        actions.appendChild(deleteButton);


        div.appendChild(checkbox);

        div.appendChild(name);

        div.appendChild(stars);

        div.appendChild(actions);


        div.addEventListener(
            "click",
            () => {

                togglePlayer(player);

            }
        );


        grid.appendChild(div);

    });


    updateCounter();

}


/* SELECCIONAR / DESELECCIONAR */

function togglePlayer(player) {

    const isSelected =
        selectedPlayers.includes(player);


    if (isSelected) {

        selectedPlayers =
            selectedPlayers.filter(
                p => p !== player
            );

    } else {

        if (selectedPlayers.length >= 12) {

            showWarning(
                "⚠️ Ya tenés 12 jugadores seleccionados."
            );

            return;

        }

        selectedPlayers.push(player);

    }


    saveData();

    renderPlayers();

}


/* CONTADOR */

function updateCounter() {

    const count =
        selectedPlayers.length;


    const stickyCounter =
        document.getElementById(
            "stickyCounter"
        );


    const stickyMessage =
        document.getElementById(
            "stickyMessage"
        );


    const button =
        document.getElementById(
            "generateButton"
        );


    stickyCounter.textContent =
        `${count} / 12`;


    button.disabled =
        count !== 12;


    let messageText;

    let messageColor = "#aaa";


    if (count === 0) {

        messageText =
            "Seleccioná 12 jugadores";


    } else if (count < 12) {

        const missing =
            12 - count;

        messageText =
            `Faltan ${missing} jugador${missing === 1 ? "" : "es"}`;


    } else {

        messageText =
            "🟢 ¡Listos para jugar!";

        messageColor =
            "#55d98b";

    }


    stickyMessage.textContent =
        messageText;

    stickyMessage.style.color =
        messageColor;


    updateRatingSummary();

}


/* RESUMEN DE VALORACIONES */

function updateRatingSummary() {

    let rated = 0;


    selectedPlayers.forEach(player => {

        const data =
            playerData[player];


        if (data && data.level) {

            rated++;

        }

    });


    const unrated =
        selectedPlayers.length - rated;


    const summary =
        document.getElementById(
            "ratingSummary"
        );


    if (selectedPlayers.length === 0) {

        summary.textContent = "";

    } else {

        summary.textContent =
            `⭐ ${rated} con nivel · — ${unrated} sin valorar`;

    }

}


/* LIMPIAR */

function clearSelection() {

    selectedPlayers = [];

    saveData();

    renderPlayers();

}


/* NUEVO SÁBADO */

function newSaturday() {

    selectedPlayers = [];

    document.getElementById(
        "teamsContainer"
    ).innerHTML = "";

    document.getElementById(
        "teamTools"
    ).style.display = "none";


    saveData();

    renderPlayers();


    showWarning(
        "🔄 Nuevo sábado iniciado. Los jugadores, valoraciones e historial siguen guardados.",
        false
    );

}


/* AGREGAR JUGADOR */

function addPlayer() {

    const input =
        document.getElementById(
            "newPlayerName"
        );


    const name =
        input.value.trim();


    if (!name) {

        return;

    }


    const exists =
        players.some(
            p =>
                p.toLowerCase() ===
                name.toLowerCase()
        );


    if (exists) {

        showWarning(
            "Ese jugador ya está en la lista."
        );

        return;

    }


    players.push(name);

    playerData[name] = {};

    input.value = "";


    saveData();

    renderPlayers();


    showWarning(
        `✅ ${name} fue agregado.`,
        false
    );

}


/* ELIMINAR */

function deletePlayer(player) {

    const confirmDelete =
        confirm(
            `¿Seguro que querés eliminar a ${player}?`
        );


    if (!confirmDelete) {

        return;

    }


    players =
        players.filter(
            p => p !== player
        );


    selectedPlayers =
        selectedPlayers.filter(
            p => p !== player
        );


    delete playerData[player];


    saveData();

    renderPlayers();

}


/* MODAL */

function openEditModal(player) {

    currentEditPlayer =
        player;


    const data =
        playerData[player] || {};


    document.getElementById(
        "editName"
    ).value = player;


    document.getElementById(
        "editLevel"
    ).value =
        data.level || "";


    document.getElementById(
        "editPosition"
    ).value =
        data.position || "";


    document.getElementById(
        "editModal"
    ).style.display = "flex";

}


function closeModal() {

    currentEditPlayer =
        null;


    document.getElementById(
        "editModal"
    ).style.display = "none";

}


/* GUARDAR JUGADOR */

function savePlayer() {

    if (!currentEditPlayer) {

        return;

    }


    const oldName =
        currentEditPlayer;


    const newName =
        document.getElementById(
            "editName"
        ).value.trim();


    const level =
        document.getElementById(
            "editLevel"
        ).value;


    const position =
        document.getElementById(
            "editPosition"
        ).value;


    if (!newName) {

        alert(
            "El jugador necesita un nombre."
        );

        return;

    }


    const duplicate =
        players.some(
            p =>
                p !== oldName &&
                p.toLowerCase() ===
                newName.toLowerCase()
        );


    if (duplicate) {

        alert(
            "Ya existe un jugador con ese nombre."
        );

        return;

    }


    if (newName !== oldName) {

        players =
            players.map(
                p =>
                    p === oldName
                        ? newName
                        : p
            );


        selectedPlayers =
            selectedPlayers.map(
                p =>
                    p === oldName
                        ? newName
                        : p
            );


        playerData[newName] =
            playerData[oldName] || {};


        delete playerData[oldName];

    }


    playerData[newName] = {

        level:
            level || "",

        position:
            position || ""

    };


    saveData();

    renderPlayers();

    closeModal();

}


/* MODO */

function setMode(mode) {

    currentMode =
        mode;


    const randomButton =
        document.getElementById(
            "randomMode"
        );


    const balancedButton =
        document.getElementById(
            "balancedMode"
        );


    randomButton.classList.remove(
        "active"
    );


    balancedButton.classList.remove(
        "active"
    );


    if (mode === "random") {

        randomButton.classList.add(
            "active"
        );

    } else {

        balancedButton.classList.add(
            "active"
        );

    }

}


/* MEZCLAR */

function shuffle(array) {

    const arr =
        [...array];


    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/*
    PAREJAS

    Devuelve una clave única para una pareja.
    El orden no importa.
*/

function pairKey(playerA, playerB) {

    return [
        playerA,
        playerB
    ]
    .sort()
    .join("|||");

}


/*
    CONTAR REPETICIONES

    Cuántas parejas del mismo equipo ya
    jugaron juntas anteriormente.
*/

function countRepeatedPairs(team) {

    let repeats = 0;


    for (
        let i = 0;
        i < team.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < team.length;
            j++
        ) {

            const key =
                pairKey(
                    team[i],
                    team[j]
                );


            const times =
                matchHistory.filter(
                    match =>
                        match.pairs &&
                        match.pairs.includes(key)
                ).length;


            repeats += times;

        }

    }


    return repeats;

}


/*
    GENERAR DATOS DE PAREJAS

    Lo hacemos una sola vez por generación
    para que sea mucho más rápido.
*/

function buildPairHistory() {

    const pairCounts = {};


    matchHistory.forEach(match => {

        if (!match.pairs) {
            return;
        }


        match.pairs.forEach(pair => {

            pairCounts[pair] =
                (pairCounts[pair] || 0) + 1;

        });

    });


    return pairCounts;

}


/*
    CONTAR REPETICIONES RÁPIDAMENTE
*/

function countRepeatedPairsFast(
    team,
    pairCounts
) {

    let repeats = 0;


    for (
        let i = 0;
        i < team.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < team.length;
            j++
        ) {

            const key =
                pairKey(
                    team[i],
                    team[j]
                );


            repeats +=
                pairCounts[key] || 0;

        }

    }


    return repeats;

}


/*
    CREAR CANDIDATO
*/

function createCandidate() {

    const shuffled =
        shuffle(
            selectedPlayers
        );


    return {

        teamA:
            shuffled.slice(0, 6),

        teamB:
            shuffled.slice(6, 12)

    };

}


/*
    ALEATORIO

    Sigue siendo aleatorio, pero entre las
    combinaciones que menos repiten parejas.

    Si existe una combinación sin repeticiones,
    se elige aleatoriamente entre esas.
*/

function generateRandomTeams() {

    const pairCounts =
        buildPairHistory();


    const candidates = [];


    for (
        let attempt = 0;
        attempt < 2500;
        attempt++
    ) {

        const candidate =
            createCandidate();


        const repeatsA =
            countRepeatedPairsFast(
                candidate.teamA,
                pairCounts
            );


        const repeatsB =
            countRepeatedPairsFast(
                candidate.teamB,
                pairCounts
            );


        const repeats =
            repeatsA + repeatsB;


        candidates.push({

            ...candidate,

            repeats

        });

    }


    const bestRepeatCount =
        Math.min(
            ...candidates.map(
                candidate =>
                    candidate.repeats
            )
        );


    const bestCandidates =
        candidates.filter(
            candidate =>
                candidate.repeats ===
                bestRepeatCount
        );


    return bestCandidates[
        Math.floor(
            Math.random() *
            bestCandidates.length
        )
    ];

}


/* NIVEL */

function getPlayerLevel(player) {

    const data =
        playerData[player];


    if (!data || !data.level) {

        return 3;

    }


    return Number(
        data.level
    );

}


/* TOTAL */

function calculateTeamLevel(team) {

    return team.reduce(

        (total, player) =>
            total +
            getPlayerLevel(player),

        0

    );

}


/*
    EQUILIBRADO

    Prioridad:

    1. Menos parejas repetidas.
    2. Menor diferencia de nivel.
    3. Aleatoriedad entre candidatos equivalentes.
*/

function generateBalancedTeams() {

    const pairCounts =
        buildPairHistory();


    const candidates = [];


    for (
        let attempt = 0;
        attempt < 4000;
        attempt++
    ) {

        const candidate =
            createCandidate();


        const levelA =
            calculateTeamLevel(
                candidate.teamA
            );


        const levelB =
            calculateTeamLevel(
                candidate.teamB
            );


        const difference =
            Math.abs(
                levelA - levelB
            );


        const repeats =
            countRepeatedPairsFast(
                candidate.teamA,
                pairCounts
            )
            +
            countRepeatedPairsFast(
                candidate.teamB,
                pairCounts
            );


        candidates.push({

            ...candidate,

            difference,

            repeats

        });

    }


    /*
        Primero encontramos la menor cantidad
        posible de repeticiones.
    */

    const bestRepeatCount =
        Math.min(
            ...candidates.map(
                candidate =>
                    candidate.repeats
            )
        );


    const withoutExtraRepeats =
        candidates.filter(
            candidate =>
                candidate.repeats ===
                bestRepeatCount
        );


    /*
        Entre esas combinaciones elegimos las
        que tengan mejor equilibrio.
    */

    const bestDifference =
        Math.min(
            ...withoutExtraRepeats.map(
                candidate =>
                    candidate.difference
            )
        );


    const bestCandidates =
        withoutExtraRepeats.filter(
            candidate =>
                candidate.difference ===
                bestDifference
        );


    return bestCandidates[
        Math.floor(
            Math.random() *
            bestCandidates.length
        )
    ];

}


/*
    CREAR PAREJAS PARA GUARDAR EN HISTORIAL
*/

function getTeamPairs(team) {

    const pairs = [];


    for (
        let i = 0;
        i < team.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < team.length;
            j++
        ) {

            pairs.push(
                pairKey(
                    team[i],
                    team[j]
                )
            );

        }

    }


    return pairs;

}


/* ARMAR EQUIPOS */

function generateTeams() {

    if (
        selectedPlayers.length !== 12
    ) {

        showWarning(
            "⚠️ Necesitás seleccionar exactamente 12 jugadores."
        );

        return;

    }


    let result;


    if (
        currentMode ===
        "balanced"
    ) {

        result =
            generateBalancedTeams();

    } else {

        result =
            generateRandomTeams();

    }


    displayTeams(
        result.teamA,
        result.teamB
    );


    saveLastMatch(
        result.teamA,
        result.teamB
    );


    /*
        SCROLL SUAVE A LOS EQUIPOS
    */

    setTimeout(
        () => {

            document
                .getElementById("teamsSection")
                .scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

        },
        100
    );

}


/* MOSTRAR EQUIPOS */

function displayTeams(
    teamA,
    teamB
) {

    const container =
        document.getElementById(
            "teamsContainer"
        );


    container.innerHTML = `

        <div class="team team-a">

            <h2>
                🔵 Equipo A
            </h2>

            ${teamA
                .map(playerHTML)
                .join("")
            }

            <div class="team-total">
                Nivel total:
                ${calculateTeamLevel(teamA)}
            </div>

        </div>


        <div class="team team-b">

            <h2>
                🔴 Equipo B
            </h2>

            ${teamB
                .map(playerHTML)
                .join("")
            }

            <div class="team-total">
                Nivel total:
                ${calculateTeamLevel(teamB)}
            </div>

        </div>

    `;


    document.getElementById(
        "teamTools"
    ).style.display = "flex";

}


/* JUGADOR DEL EQUIPO */

function playerHTML(player) {

    const data =
        playerData[player] || {};


    const stars =
        data.level
            ? "★".repeat(
                Number(data.level)
            )
            : "";


    return `

        <div class="team-player">

            <span>
                ${escapeHTML(player)}
            </span>

            ${
                stars
                    ? `
                        <span class="stars">
                            ${stars}
                        </span>
                    `
                    : ""
            }

        </div>

    `;

}


/* COPIAR EQUIPOS */

function copyTeams() {

    const teams =
        getCurrentTeams();


    if (!teams) {

        return;

    }


    const text =

`⚽ FÚTBOL DEL SÁBADO

🔵 EQUIPO A
${teams.teamA.join("\n")}

🔴 EQUIPO B
${teams.teamB.join("\n")}`;


    navigator.clipboard
        .writeText(text)
        .then(
            () => {

                showWarning(
                    "📋 ¡Equipos copiados! Ya podés pegarlos en WhatsApp.",
                    false
                );

            }
        )
        .catch(
            () => {

                showWarning(
                    "No se pudo copiar automáticamente."
                );

            }
        );

}


/*
    OBTENER EQUIPOS ACTUALES
*/

function getCurrentTeams() {

    const teamElements =
        document.querySelectorAll(
            "#teamsContainer .team"
        );


    if (teamElements.length !== 2) {

        showWarning(
            "⚠️ Primero tenés que armar los equipos."
        );

        return null;

    }


    const teams = {

        teamA: [],

        teamB: []

    };


    teamElements.forEach(
        (teamElement, index) => {

            const players =
                teamElement.querySelectorAll(
                    ".team-player span:first-child"
                );


            players.forEach(
                playerElement => {

                    if (index === 0) {

                        teams.teamA.push(
                            playerElement.textContent.trim()
                        );

                    } else {

                        teams.teamB.push(
                            playerElement.textContent.trim()
                        );

                    }

                }
            );

        }
    );


    return teams;

}


/*
    COMPARTIR COMO IMAGEN

    Genera una imagen directamente con Canvas.
*/

async function shareTeamsAsImage() {

    const teams =
        getCurrentTeams();


    if (!teams) {

        return;

    }


    const canvas =
        document.createElement("canvas");


    const width = 900;

    const height = 1050;


    canvas.width = width;

    canvas.height = height;


    const ctx =
        canvas.getContext("2d");


    /*
        FONDO
    */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
        TÍTULO
    */

    ctx.fillStyle = "#ffffff";

    ctx.textAlign = "center";

    ctx.font =
        "bold 42px Arial";


    ctx.fillText(
        "⚽ FÚTBOL DEL SÁBADO",
        width / 2,
        70
    );


    /*
        EQUIPO A
    */

    drawTeamOnCanvas(
        ctx,
        teams.teamA,
        "🔵 EQUIPO A",
        120,
        "#4da3ff"
    );


    /*
        EQUIPO B
    */

    drawTeamOnCanvas(
        ctx,
        teams.teamB,
        "🔴 EQUIPO B",
        580,
        "#ff6868"
    );


    canvas.toBlob(
        async blob => {

            if (!blob) {

                showWarning(
                    "No se pudo crear la imagen."
                );

                return;

            }


            const file =
                new File(
                    [blob],
                    "equipos-futbol.png",
                    {
                        type:
                            "image/png"
                    }
                );


            /*
                En celulares compatibles,
                intenta abrir directamente
                el menú de compartir.
            */

            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                try {

                    await navigator.share({

                        title:
                            "Equipos del sábado",

                        text:
                            "⚽ Equipos del sábado",

                        files:
                            [file]

                    });

                    return;

                } catch (error) {

                    /*
                        Si el usuario cancela,
                        no hacemos nada.
                    */

                    if (
                        error.name ===
                        "AbortError"
                    ) {

                        return;

                    }

                }

            }


            /*
                Si el navegador no soporta
                compartir archivos, descarga
                la imagen.
            */

            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href = url;

            link.download =
                "equipos-futbol.png";

            link.click();


            URL.revokeObjectURL(url);


            showWarning(
                "📸 Imagen creada.",
                false
            );

        },
        "image/png"
    );

}


/*
    DIBUJAR EQUIPO EN CANVAS
*/

function drawTeamOnCanvas(
    ctx,
    team,
    title,
    startY,
    titleColor
) {

    ctx.textAlign = "center";

    ctx.fillStyle =
        titleColor;

    ctx.font =
        "bold 34px Arial";


    ctx.fillText(
        title,
        450,
        startY
    );


    ctx.textAlign = "left";

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "28px Arial";


    team.forEach(
        (player, index) => {

            ctx.fillText(
                `${index + 1}. ${player}`,
                170,
                startY + 55 + (index * 52)
            );

        }
    );

}


/* GUARDAR ULTIMO ARMADO */

function saveLastMatch(
    teamA,
    teamB
) {

    const pairs = [

        ...getTeamPairs(teamA),

        ...getTeamPairs(teamB)

    ];


    lastMatch = {

        date:
            new Date().toLocaleString(
                "es-AR",
                {
                    dateStyle:
                        "full",

                    timeStyle:
                        "short"
                }
            ),

        mode:
            currentMode,

        teamA:
            [...teamA],

        teamB:
            [...teamB]

    };


    /*
        Guardamos historial interno.

        Esto no modifica lo que se muestra
        en "Último armado".
    */

    matchHistory.push({

        date:
            new Date().toISOString(),

        players:
            [
                ...teamA,
                ...teamB
            ],

        teamA:
            [...teamA],

        teamB:
            [...teamB],

        pairs:
            pairs

    });


    /*
        Dejamos como máximo los últimos
        30 partidos para no acumular datos
        innecesarios.
    */

    if (
        matchHistory.length > 30
    ) {

        matchHistory =
            matchHistory.slice(-30);

    }


    saveData();

    renderLastMatch();

}


/* MOSTRAR ULTIMO ARMADO */

function renderLastMatch() {

    const container =
        document.getElementById(
            "lastMatchContent"
        );


    if (!lastMatch) {

        container.innerHTML = `

            <div class="empty-last">
                Todavía no hay un armado anterior.
            </div>

        `;

        return;

    }


    const modeText =
        lastMatch.mode ===
        "balanced"

            ? "⚖️ Equilibrado"

            : "🎲 Aleatorio";


    container.innerHTML = `

        <div class="last-date">

            ${escapeHTML(
                lastMatch.date
            )}

            · ${modeText}

        </div>


        <div class="last-teams">


            <div class="last-team">

                <h3>
                    🔵 Equipo A
                </h3>

                <ul>

                    ${lastMatch.teamA

                        .map(
                            p =>
                                `<li>
                                    ${escapeHTML(p)}
                                </li>`
                        )

                        .join("")

                    }

                </ul>

            </div>


            <div class="last-team">

                <h3>
                    🔴 Equipo B
                </h3>

                <ul>

                    ${lastMatch.teamB

                        .map(
                            p =>
                                `<li>
                                    ${escapeHTML(p)}
                                </li>`
                        )

                        .join("")

                    }

                </ul>

            </div>


        </div>

    `;

}


/* MENSAJE */

function showWarning(
    message,
    isError = true
) {

    const warning =
        document.getElementById(
            "warning"
        );


    warning.textContent =
        message;


    warning.style.display =
        "block";


    if (!isError) {

        warning.style.background =
            "#183a27";

        warning.style.borderColor =
            "#286b43";

        warning.style.color =
            "#9ff0ba";

    } else {

        warning.style.background =
            "#432525";

        warning.style.borderColor =
            "#733737";

        warning.style.color =
            "#ffb5b5";

    }


    clearTimeout(
        window.warningTimeout
    );


    window.warningTimeout =
        setTimeout(
            () => {

                warning.style.display =
                    "none";

            },
            3000
        );

}


/* SEGURIDAD HTML */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* CERRAR MODAL */

document
    .getElementById("editModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );


/* INICIAR */

renderPlayers();

renderLastMatch();

</script>
