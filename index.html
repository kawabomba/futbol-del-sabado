<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Fútbol del Sábado</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f1115;
        color: #f1f1f1;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin: 5px 0 25px;
        font-size: 30px;
    }

    .card {
        background: #181b21;
        border: 1px solid #292e38;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 18px;
    }

    h2 {
        margin-top: 0;
        font-size: 20px;
    }

    /* JUGADORES */

    #playersList {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    .player {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        background: #22262e;
        border-radius: 10px;
        padding: 10px;
        min-width: 0;
    }

    .player label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        min-width: 0;
        flex: 1;
    }

    .player-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .player input[type="checkbox"] {
        width: 19px;
        height: 19px;
        accent-color: #32d583;
        flex-shrink: 0;
    }

    .delete {
        background: transparent;
        border: none;
        color: #ff5c5c;
        font-size: 18px;
        cursor: pointer;
        padding: 2px 4px;
    }

    /* AGREGAR */

    .add-player {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .add-player input {
        flex: 1;
        min-width: 0;
        background: #101217;
        border: 1px solid #343a46;
        color: white;
        border-radius: 9px;
        padding: 12px;
        font-size: 15px;
    }

    button {
        border: none;
        border-radius: 9px;
        cursor: pointer;
        font-weight: bold;
    }

    .add-btn {
        background: #32d583;
        color: #07140d;
        padding: 0 18px;
    }

    .small-buttons {
        display: flex;
        gap: 10px;
        margin-top: 12px;
    }

    .small-buttons button {
        background: #292e38;
        color: #ddd;
        padding: 9px 12px;
    }

    /* ARMAR EQUIPOS */

    .main-button {
        width: 100%;
        padding: 16px;
        background: #32d583;
        color: #07140d;
        font-size: 18px;
        margin-top: 5px;
    }

    /* EQUIPOS */

    #teams {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
    }

    .team {
        background: #181b21;
        border: 1px solid #292e38;
        border-radius: 14px;
        padding: 18px;
    }

    .team h2 {
        text-align: center;
        margin-bottom: 15px;
    }

    .team ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .team li {
        background: #22262e;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 7px;
    }

    .empty {
        text-align: center;
        color: #888;
        margin: 10px 0;
    }

    /* CELULAR */

    @media (max-width: 700px) {
        .container {
            padding: 12px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 18px;
        }

        #playersList {
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .player {
            padding: 9px;
        }

        .add-player {
            flex-direction: row;
        }

        .add-btn {
            padding: 0 14px;
        }

        #teams {
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .team {
            padding: 12px;
        }

        .team h2 {
            font-size: 17px;
        }

        .team li {
            padding: 9px 6px;
            font-size: 14px;
        }
    }

    @media (max-width: 400px) {
        #playersList {
            grid-template-columns: 1fr 1fr;
        }

        .player-name {
            font-size: 14px;
        }

        .delete {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>⚽ Fútbol del Sábado</h1>

    <div class="card">

        <h2>👥 ¿Quiénes vienen?</h2>

        <div id="playersList"></div>

        <div class="add-player">
            <input
                type="text"
                id="newPlayer"
                placeholder="Nombre del nuevo jugador"
            >
            <button class="add-btn" onclick="addPlayer()">Agregar</button>
        </div>

        <div class="small-buttons">
            <button onclick="selectAll()">Seleccionar todos</button>
            <button onclick="clearAll()">Limpiar</button>
        </div>

    </div>

    <button class="main-button" onclick="makeTeams()">
        🎲 ARMAR EQUIPOS
    </button>

    <div id="teams"></div>

</div>

<script>

let players = JSON.parse(localStorage.getItem("players")) || [
    "Kevin",
    "Carlos",
    "Brian",
    "Alan Lopez",
    "Alan Casla",
    "Joel Abejita",
    "Facu",
    "Joaquin",
    "Menzo",
    "Martin",
    "Ivo",
    "Nicolas",
    "El Pela",
    "Mateo",
    "Gian",
    "Yuseet"
];

let selected = JSON.parse(localStorage.getItem("selected")) || [];

function saveData() {
    localStorage.setItem("players", JSON.stringify(players));
    localStorage.setItem("selected", JSON.stringify(selected));
}

function renderPlayers() {

    const list = document.getElementById("playersList");

    list.innerHTML = "";

    players.forEach((player, index) => {

        const div = document.createElement("div");
        div.className = "player";

        const label = document.createElement("label");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = selected.includes(player);

        checkbox.addEventListener("change", () => {

            if (checkbox.checked) {

                if (!selected.includes(player)) {
                    selected.push(player);
                }

            } else {

                selected = selected.filter(p => p !== player);

            }

            saveData();
        });

        const name = document.createElement("span");
        name.className = "player-name";
        name.textContent = player;

        label.appendChild(checkbox);
        label.appendChild(name);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "✕";

        deleteButton.onclick = () => {

            players.splice(index, 1);
            selected = selected.filter(p => p !== player);

            saveData();
            renderPlayers();
        };

        div.appendChild(label);
        div.appendChild(deleteButton);

        list.appendChild(div);
    });
}

function addPlayer() {

    const input = document.getElementById("newPlayer");

    const name = input.value.trim();

    if (!name) return;

    if (players.includes(name)) {
        alert("Ese jugador ya está en la lista.");
        return;
    }

    players.push(name);
    selected.push(name);

    input.value = "";

    saveData();
    renderPlayers();
}

function selectAll() {

    selected = [...players];

    saveData();
    renderPlayers();
}

function clearAll() {

    selected = [];

    saveData();
    renderPlayers();

    document.getElementById("teams").innerHTML = "";
}

function makeTeams() {

    if (selected.length < 2) {
        alert("Necesitás seleccionar al menos 2 jugadores.");
        return;
    }

    let shuffled = [...selected];

    for (let i = shuffled.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const teamA = [];
    const teamB = [];

    shuffled.forEach((player, index) => {

        if (index % 2 === 0) {
            teamA.push(player);
        } else {
            teamB.push(player);
        }

    });

    const teams = document.getElementById("teams");

    teams.innerHTML = `
        <div class="team">
            <h2>🔵 Equipo 1</h2>
            <ul>
                ${teamA.map(player => `<li>${player}</li>`).join("")}
            </ul>
        </div>

        <div class="team">
            <h2>🔴 Equipo 2</h2>
            <ul>
                ${teamB.map(player => `<li>${player}</li>`).join("")}
            </ul>
        </div>
    `;

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}

renderPlayers();

</script>

</body>
</html>
